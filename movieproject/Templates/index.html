{% extends 'base.html' %}
{% block body %}

<div class="page-header">
    <h1 class="page-title">Movie Collection</h1>
</div>

<div class="container">
    <div class="movie-grid">
        {% for i in movie_list %}
        <div class="movie-card">
            <div class="movie-poster-container">
                <img src="{{i.Images.url}}" alt="{{i.Name}}" class="movie-poster">
                <div class="movie-overlay">
                    <div class="overlay-content">
                        <h3>{{i.Name}}</h3>
                        <p>{{i.Year}}</p>
                    </div>
                </div>
            </div>
            <div class="movie-card-body">
                <h2 class="movie-title">{{i.Name}}</h2>
                <p class="movie-description">{{i.Description}}</p>
                <div class="movie-actions">
                    <a href="{% url 'movieapp:details' i.id %}" class="btn-futuristic">View Details</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="empty-state">
            <h2>No Movies Found</h2>
            <p>Start building your collection by adding your first movie!</p>
            <a href="/add/" class="btn-futuristic">Add Your First Movie</a>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
