{% extends 'base.html' %}
{% block body %}

<div class="page-header">
    <h1 class="page-title">Delete Movie</h1>
</div>

<div class="container">
    <div class="form-container">
        <h2 class="form-title">Confirm Deletion</h2>
        <div class="delete-confirmation">
            <p>Are you sure you want to delete this movie? This action cannot be undone.</p>
            <form method="post" class="delete-form">
                {% csrf_token %}
                <div class="form-actions">
                    <button type="submit" class="btn-danger">Delete Movie</button>
                    <a href="/" class="btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
