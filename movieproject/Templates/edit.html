{% extends 'base.html' %}
{% block body %}

<div class="page-header">
    <h1 class="page-title">Edit Movie</h1>
</div>

<div class="container">
    <div class="form-container">
        <h2 class="form-title">Update Movie Details</h2>
        <form method="post" enctype="multipart/form-data" class="movie-form">
            {% csrf_token %}
            {{Form.as_p}}
            <div class="form-actions">
                <button type="submit" class="btn-futuristic">Update Movie</button>
                <a href="{% url 'movieapp:details' movie.id %}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
