{% extends 'base.html' %}
{% block body %}

<div class="page-header">
    <h1 class="page-title">Add New Movie</h1>
</div>

<div class="container">
    <div class="form-container">
        <h2 class="form-title">Add to Your Collection</h2>
        <form method="post" enctype="multipart/form-data" class="movie-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="Name" class="form-label">Movie Title</label>
                <input type="text" name="Name" id="Name" class="form-control" placeholder="Enter the movie name" required>
            </div>
            
            <div class="form-group">
                <label for="Description" class="form-label">Description</label>
                <textarea name="Description" id="Description" class="form-control" rows="4" placeholder="Enter movie description" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="Year" class="form-label">Release Year</label>
                <input type="number" name="Year" id="Year" class="form-control" placeholder="Enter movie year" min="1900" max="2030" required>
            </div>
            
            <div class="form-group">
                <label for="Images" class="form-label">Movie Poster</label>
                <input type="file" name="Images" id="Images" class="form-control-file" accept="image/*" required>
                <small class="form-text">Upload a movie poster image</small>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-futuristic">Add Movie</button>
                <a href="/" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
